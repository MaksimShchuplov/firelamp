name: Build and Publish Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git log changelog

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        run: pio run -e esp32s3

      - name: Generate version.json and changelog
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "GIT_SHA=${GIT_SHA}" >> $GITHUB_ENV
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MD5=$(md5sum .pio/build/esp32s3/firmware.bin | awk '{print $1}')
          echo "{\"version\":\"${GIT_SHA}\",\"date\":\"${BUILD_DATE}\",\"md5\":\"${MD5}\"}" > version.json

          # Changelog: commits since the previous build-* tag (or last 10 if no prior tag)
          PREV_TAG=$(git tag --list 'build-*' --sort=-creatordate | sed -n '1p')
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" | grep -v '^$')
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No new commits since last build"
          fi

          # Write to file so the release action can read it (avoids shell escaping issues)
          echo "$CHANGELOG" > changelog.txt
          echo "--- Changelog ---"
          cat changelog.txt

      - name: Publish versioned release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ".pio/build/esp32s3/firmware.bin,version.json"
          tag: "build-${{ env.GIT_SHA }}"
          name: "Build ${{ env.GIT_SHA }}"
          bodyFile: "changelog.txt"
          makeLatest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release pointer
        uses: ncipollo/release-action@v1
        with:
          artifacts: ".pio/build/esp32s3/firmware.bin,version.json"
          tag: "latest"
          name: "Latest Firmware"
          bodyFile: "changelog.txt"
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
