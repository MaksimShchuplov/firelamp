name: Build and Publish Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        run: pio run -e esp32s3

      - name: Publish Binary to 'binaries' branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Backup binary
          cp .pio/build/esp32s3/firmware.bin /tmp/firmware.bin
          
          # Check if binaries branch exists on remote
          git fetch origin
          if git ls-remote --exit-code --heads origin binaries; then
            git checkout binaries
          else
            git checkout --orphan binaries
          fi
          
          # Remove all source files from this branch
          git rm -rf . || true
          
          # Add only the compiled binary
          cp /tmp/firmware.bin ./firmware.bin
          git add firmware.bin
          
          # Commit and force push to keep history clean (1 commit only)
          git commit -m "Auto-build firmware.bin from ${GITHUB_SHA::7}" || true
          git push origin HEAD:binaries -f
