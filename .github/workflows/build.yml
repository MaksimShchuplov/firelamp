name: Build and Publish Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        run: pio run -e esp32s3

      - name: Generate version.json
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "GIT_SHA=${GIT_SHA}" >> $GITHUB_ENV
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MD5=$(md5sum .pio/build/esp32s3/firmware.bin | awk '{print $1}')
          echo "{\"version\":\"${GIT_SHA}\",\"date\":\"${BUILD_DATE}\",\"md5\":\"${MD5}\"}" > version.json
          echo "Generated version.json:"
          cat version.json

      - name: Publish versioned release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ".pio/build/esp32s3/firmware.bin,version.json"
          tag: "build-${{ env.GIT_SHA }}"
          name: "Build ${{ env.GIT_SHA }}"
          body: "Firmware built from commit ${{ env.GIT_SHA }}."
          makeLatest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release pointer
        uses: ncipollo/release-action@v1
        with:
          artifacts: ".pio/build/esp32s3/firmware.bin,version.json"
          tag: "latest"
          name: "Latest Firmware"
          body: "Auto-generated firmware build from main branch (commit ${{ env.GIT_SHA }})."
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
