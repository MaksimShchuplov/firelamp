name: Build and Publish Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Two pushes to main landing within one build duration would both update the
# rolling `latest` release, and its two assets are replaced one request at a
# time — interleaving can leave run B's firmware.bin beside run A's
# version.json, so every device's /update streams the binary and then fails
# the MD5 check. Serialise rather than cancel: each commit still publishes its
# own immutable build-* release.
concurrency:
  group: publish-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # full history needed for git log changelog

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio pytest

      - name: Run Python tests
        run: pytest test/ -v --tb=short

      - name: Run JS tests
        run: node test/test_ui.js

      - name: Run C++ native unit tests
        run: make -C test/native

      - name: Build Firmware
        run: pio run -e esp32s3

      - name: Generate version.json and changelog
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_STAMP=$(date -u +"%Y%m%d-%H%M%S")
          BUILD_TAG="build-${BUILD_STAMP}-${GIT_SHA}"
          echo "GIT_SHA=${GIT_SHA}" >> $GITHUB_ENV
          echo "BUILD_TAG=${BUILD_TAG}" >> $GITHUB_ENV
          echo "BUILD_STAMP=${BUILD_STAMP}" >> $GITHUB_ENV
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MD5=$(md5sum .pio/build/esp32s3/firmware.bin | awk '{print $1}')
          echo "{\"version\":\"${GIT_SHA}\",\"build_n\":${{ github.run_number }},\"date\":\"${BUILD_DATE}\",\"md5\":\"${MD5}\"}" > version.json

          # Changelog: commits since the previous build-* tag (or last 10 if no prior tag)
          # Tag names embed a UTC timestamp, so a lexicographic sort is chronological
          # and does not depend on tag type the way --sort=-creatordate does.
          PREV_TAG=$(git tag --list 'build-*' | sort -r | sed -n '1p')
          # `|| true`: an empty commit range makes git log output nothing, and under
          # `bash -e` a non-zero status here kills the step before the `-z` fallback
          # below can run. Same for a tag that is missing locally.
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" || true)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10 || true)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No new commits since last build"
          fi

          # Write to file so the release action can read it (avoids shell escaping issues)
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}"
          printf "Built from commit [%s](%s)\n\n%s\n" "$GIT_SHA" "$COMMIT_URL" "$CHANGELOG" > changelog.txt
          echo "--- Changelog ---"
          cat changelog.txt

      - name: Publish versioned release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          artifacts: ".pio/build/esp32s3/firmware.bin,version.json"
          tag: "${{ env.BUILD_TAG }}"
          commit: ${{ github.sha }}
          name: "Build ${{ env.BUILD_STAMP }} (${{ env.GIT_SHA }})"
          bodyFile: "changelog.txt"
          makeLatest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release pointer
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          artifacts: ".pio/build/esp32s3/firmware.bin,version.json"
          tag: "latest"
          commit: ${{ github.sha }}
          name: "Latest Firmware"
          bodyFile: "changelog.txt"
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
